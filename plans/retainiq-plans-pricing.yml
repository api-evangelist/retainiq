description: >-
  RetainIQ prices two distinct things, and they are not the same product. (1) The retention-marketing
  SERVICE sold at retainiq.io — a managed lifecycle email and SMS engagement, published as an entry
  price of $990/month on month-to-month terms, with the actual scope quoted per brand rather than
  sold as fixed tiers. (2) The RetainIQ Shopify app — free to install, then metered on personalization
  CREDITS at $999 per 100,000 credits after 20,000 free credits per month, billed in USD. There is no
  API plan, no developer tier and no rate-limit-bearing plan of any kind, because RetainIQ publishes
  no public API.
notes: >-
  The $990/month service price is stated on retainiq.io/services alongside three named engagement
  models (Synergy, Full Service, Off Season); those are delivery shapes, not priced tiers, so they are
  not enumerated as plans. The Shopify credit price is quoted verbatim from the app listing's own
  Pricing section. Note that the Shopify app's stated developer website (wyde.ai) now redirects to a
  domain-for-sale listing and the app host app.retainiq.io returns Cloudflare 522, so the app plan is
  recorded as published-but-unverified rather than as a live self-serve path — see
  lifecycle/retainiq-lifecycle.yml.
