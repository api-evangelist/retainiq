name: RetainIQ
description: 'RetainIQ is a full-service retention-marketing agency for direct-to-consumer
  (D2C) brands, delivering lifecycle email and SMS programs. Its work spans automated
  flows (welcome, cart abandonment, post-purchase, win-back, replenishment), weekly
  strategic campaign sends with design and copywriting, and deliverability/segmentation/list-hygiene
  infrastructure. A proprietary 1:1 personalization engine generates variant product
  blocks at scale. A Klaviyo Gold Master Partner and Omnisend partner, RetainIQ integrates
  with Shopify, Klaviyo, and Omnisend; plans start at $990/mo on month-to-month terms.
  It operates as a marketing-services agency and does not publish a public developer
  API, SDK, or documentation surface.'
