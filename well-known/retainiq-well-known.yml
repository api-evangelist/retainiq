summary: >-
  RetainIQ publishes no /.well-known/ discovery surface on any host it controls. Every
  well-known path returns a real HTTP 404 from the Next.js marketing site at retainiq.io
  (a genuine 404, not an SPA soft-200 shell), and every REST/GraphQL contract path 404s
  alongside them. NO WellKnown or SecurityTxt pointer is emitted from this file — this
  artifact records a verified ABSENCE, not a presence. The only machine-readable surface
  found anywhere on the domain is the WordPress core REST API exposed by the legacy blog
  at retainiq.io/blog/wp-json/ — that is platform-provided by WordPress, not a RetainIQ
  product API, so it is recorded here and deliberately NOT wired as an API in apis.yml.
